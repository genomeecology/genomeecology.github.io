- title: MycoMobilome
  subtitle: A non-redundant database of transposable elements for the fungal kingdom
  group: tools-datasets
  image: images/projects/mycomobilome.png
  link: https://github.com/TobyBaril/MycoMobilome
  paper: https://doi.org/10.1093/nargab/lqag026
  description: MycoMobilome is a database of transposable elements (TEs) from the fungal kingdom. It provides a comprehensive and non-redundant collection of TEs, along with their classification, annotation, and associated metadata. MycoMobilome aims to facilitate the study of TE diversity, evolution, and impact on fungal genomes.
  repo: tobybaril/mycomobilome
  badges:
    - src: https://zenodo.org/badge/DOI/10.5281/zenodo.18243921.svg
      alt: Zenodo
      href: https://doi.org/10.5281/zenodo.18243921
  tags:
    - database
    - publication
    - transposable-elements

- title: Earl Grey
  subtitle: User-friendly TE annotation for everyone!
  group: tools-datasets
  image: images/projects/earlgrey.png
  link: https://github.com/TobyBaril/EarlGrey
  description: Fully automated, user-friendly, and reproducible transposable element annotation pipeline for eukaryotic genomes. Earl Grey is designed to be easy to use for both novice and experienced users, providing a comprehensive TE annotation workflow that can be run with minimal input and configuration.
