- title: Transposable Elements, Host-TE Interactions, and Genome Evolution
  group: interests
  image: images/projects/te-phylo.png
  description: We are fascinated by the role of transposable elements (TEs) in shaping genomes and generating genetic novelty. We view these interactions through an ecological lens, where the genome is itself an environment in which TEs must survive and replicate alongside the host machinery that seeks to suppress them and maintain genome integrity. We investigate how these mobile pieces of DNA interact with their hosts, influence adaptation, and contribute to genome evolution across the tree of life. By studying organisms ranging from fungi to plants and animals, and timescales ranging from contemporary populations to hundreds of millions of years of evolution, we aim to understand when TEs act as genomic parasites, when they become drivers of innovation, and how these interactions shape biodiversity.

- title: Ecological Interactions and Biodiversity Change
  group: interests
  image: images/projects/genome-ecology.png
  description: We want to understand how ecological change at every scale, from within genomes to across ecosystems, shapes adaptation and biodiversity. Just as species interact with one another in ecosystems, genomes are shaped by the environments in which they evolve. We investigate how environmental change influences genome architecture and structural variation, and how these changes contribute to adaptation. By linking ecological processes to genome evolution, we aim to understand how species respond to environmental challenges and what this means for the future of biodiversity.

- title: AI and Computational Tools for Biodiversity Genomics
  group: interests
  image: images/projects/ai-genomics.png
  description: We are excited by the potential of artificial intelligence (AI) to transform how we study genome evolution. We develop interpretable AI approaches that help researchers identify and understand genes, TEs, and other genomic features across diverse organisms. Rather than treating AI as a black box, we aim to use these models to uncover the biological rules that govern genome organisation and evolution. In parallel, we develop tools that make genomic analyses more accessible across the diversity of life.

- title: The Evolutionary History of Mobile DNA
  group: interests
  image: images/projects/te-evolution.png
  description: How did TEs become such a widespread and enduring feature of eukaryotic genomes? Using large-scale comparative genomics, we reconstruct the origins, diversification, and spread of TEs across the tree of life. By tracing their evolutionary histories over hundreds of millions of years, we aim to understand why some TE lineages flourish while others disappear, and how TEs have evolved to persist over deep time.

- title: Earl Grey ParTEA
  subtitle: Multiple genomes? Time for a ParTEA!
  group: tools-datasets
  image: images/projects/partea.png
  link: https://github.com/TobyBaril/EarlGreyParTEA
  description: ParTEA (Pangenome Transposable Element Analysis) is a Snakemake-based pipeline that brings the party to multi-genome TE annotation! It extends EarlGrey to process multiple genomes in parallel, build pangenome TE libraries, and perform comparative transposable element analysis across species.
  repo: tobybaril/earlgreypartea
